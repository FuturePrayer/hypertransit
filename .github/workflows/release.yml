name: release

on:
  push:
    tags:
      - '*'

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: checkout repository
        uses: actions/checkout@v6

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: build
        run: ./gradlew build

      - name: read version info
        id: props
        run: |
          echo "mod_version=$(grep 'mod_version' gradle.properties | cut -d'=' -f2)" >> $GITHUB_OUTPUT
          echo "minecraft_version=$(grep 'minecraft_version' gradle.properties | cut -d'=' -f2)" >> $GITHUB_OUTPUT
          echo "loader_version=$(grep 'loader_version' gradle.properties | cut -d'=' -f2)" >> $GITHUB_OUTPUT
          echo "fabric_api_version=$(grep 'fabric_api_version' gradle.properties | cut -d'=' -f2)" >> $GITHUB_OUTPUT

      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          name: HyperTransit ${{ steps.props.outputs.mod_version }}
          files: |
            build/libs/hypertransit-${{ steps.props.outputs.mod_version }}.jar
          body: |
            ## HyperTransit ${{ steps.props.outputs.mod_version }}

            更快的船和矿车！

            ### 环境要求

            | 组件 | 版本 |
            |------|------|
            | Minecraft | ${{ steps.props.outputs.minecraft_version }} |
            | Fabric Loader | ≥ ${{ steps.props.outputs.loader_version }} |
            | Fabric API | ${{ steps.props.outputs.fabric_api_version }} |
            | Java | ≥ 25 |

            ### 安装

            将本 jar 文件与 [Fabric API](https://modrinth.com/mod/fabric-api) 放入 `mods/` 文件夹即可。
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
